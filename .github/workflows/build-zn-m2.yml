name: build-zn-m2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'target/linux/qualcommax/**'
      - 'config/**'
      - '.github/workflows/build-zn-m2.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cp config/zn-m2.config .config
          make defconfig
          grep -E "TARGET_qualcommax_ipq60xx_DEVICE|CONFIG_TARGET_BOARD|CONFIG_TARGET_SUBTARGET" .config

      - name: Download packages
        run: make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Show output
        run: ls -lh bin/targets/qualcommax/ipq60xx/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: zn-m2-firmware
          path: bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
